<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111f"><title>PATINER</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#eef8ff;font-family:system-ui,Arial;touch-action:none}canvas{width:100vw;height:100dvh;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;gap:8px}.pill,.btn{background:#06111fe8;border:1px solid #31516d;border-radius:13px;padding:9px 11px;color:white;font-weight:800}.brand{color:#00d8ff;letter-spacing:2px;font-size:18px}.sub{font-size:10px;color:#a6bed2}.speed{font-size:24px}.modes{position:absolute;right:9px;top:90px;display:grid;gap:6px;pointer-events:auto}.mode{min-width:70px}.mode.active{border-color:#00d8ff;color:#00d8ff}.bottom{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.cluster{display:flex;gap:8px;pointer-events:auto}.ctrl{width:59px;height:59px;border-radius:18px;font-size:23px}.accel{height:72px;color:#52ffad}.brake{color:#ff7373}.hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#06111fcc;border:1px solid #31516d;padding:7px 10px;border-radius:18px;font-size:11px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:#020812e8;z-index:10;overflow:auto;touch-action:pan-y}.overlay.show{display:flex}.modal{width:min(820px,100%);max-height:92dvh;overflow:auto;background:#0b1a2d;border:1px solid #24516d;border-radius:20px;padding:16px;touch-action:pan-y}.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.head h2{margin:0;color:#00d8ff}.cards,.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-top:14px}.card,.map{background:#071625;border:1px solid #294860;border-radius:14px;padding:12px}.card.selected,.map.active{border-color:#00d8ff}.scoot{font-size:40px;text-align:center;padding:8px}.card h3{margin:4px 0}.muted{font-size:12px;color:#9fb5cc}.price{color:#55ffad;font-weight:900}.buy{background:linear-gradient(90deg,#087cff,#00bde7);border:0;color:white;border-radius:10px;padding:10px;width:100%;font-weight:900;margin-top:9px}.toast{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:20;background:#07334b;border:1px solid #00d8ff;border-radius:12px;padding:10px;font-weight:800}.toast.show{display:block}.foot{font-size:12px;color:#9fb5cc;line-height:1.5}@media(max-width:500px){.brand{font-size:15px}.pill{padding:7px 8px}.speed{font-size:20px}.mode{font-size:12px;min-width:63px;padding:8px}.ctrl{width:53px;height:53px}.accel{height:66px}.hint{font-size:9px;bottom:83px}}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="pill"><div class="brand">👑 PATINER</div><div class="sub" id="model">KUKIRIN G2 · PRIMERA PERSONA</div></div><div class="pill"><div class="speed"><span id="speed">0</span> <span style="font-size:10px">KM/H</span></div><div class="sub">🪙 <span id="coins">250</span> monedas</div></div></div><div class="modes"><button class="btn mode active" data-mode="ECO">🍃 ECO</button><button class="btn mode" data-mode="SPORT">⚡ SPORT</button><button class="btn mode" data-mode="TURBO">🔥 TURBO</button><button class="btn" id="mapsBtn">🗺️ MAPAS</button><button class="btn" id="shopBtn">🛒 TIENDA</button></div><div class="hint">Mantén ▲ para acelerar · ■ para frenar</div><div class="bottom"><div class="cluster"><button class="btn ctrl" id="left">◀</button><button class="btn ctrl" id="right">▶</button></div><div class="cluster"><button class="btn ctrl brake" id="brake">■</button><button class="btn ctrl accel" id="accel">▲</button></div></div></div><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="modal"><div class="head"><h2 id="title">TIENDA</h2><button class="btn" id="close">✕ CERRAR</button></div><div id="body"></div></div></div>
<script>(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr,speed=0,steer=0,dist=0,coins=250,mode='ECO',map='Ciudad',owned=['G2'],selected='G2',go=false,braking=false,last=0,toastT;const bikes=[{id:'G2',name:'KuKirin G2',price:0,max:{ECO:32,SPORT:45,TURBO:55},acc:23,color:'#ff8a24'},{id:'G4',name:'KuKirin G4',price:900,max:{ECO:38,SPORT:58,TURBO:75},acc:31,color:'#ff8a24'},{id:'A1',name:'KuKirin A1',price:450,max:{ECO:28,SPORT:40,TURBO:48},acc:19,color:'#f4f6f8'},{id:'M4',name:'KuKirin M4 Pro',price:650,max:{ECO:34,SPORT:49,TURBO:62},acc:25,color:'#aebdcc'}];const skies={Ciudad:['#538db6','#f4a16e','#414c55','#252b33'],Montaña:['#4d879b','#b6d5e9','#376747','#444b50'],Playa:['#58a9c6','#ffd08a','#d9c17f','#b5a17e'],Noche:['#101a3c','#43396f','#14252c','#1b2231']};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function poly(p,col){x.fillStyle=col;x.beginPath();x.moveTo(...p[0]);p.slice(1).forEach(q=>x.lineTo(...q));x.closePath();x.fill()}function rr(a,b,w,h,r,col,stroke){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=col;x.fill();if(stroke){x.strokeStyle=stroke;x.stroke()}}function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;let s=bikes.find(b=>b.id===selected)||bikes[0],cap=s.max[mode];speed=go&&!braking?Math.min(cap,speed+s.acc*dt):braking?Math.max(0,speed-70*dt):Math.max(0,speed-8*dt);let old=dist;dist+=speed*dt/3.6;if(Math.floor(dist/220)>Math.floor(old/220)){coins+=25;toast('+25 monedas por explorar')}$('speed').textContent=Math.round(speed);$('coins').textContent=coins;let [sky,sky2,ground,road]=skies[map],h=H*.39,cx=W/2+steer*W*.13,g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,sky);g.addColorStop(1,sky2);x.fillStyle=g;x.fillRect(0,0,W,H);if(map==='Montaña')poly([[0,h],[W*.18,H*.18],[W*.32,h],[W*.51,H*.13],[W*.72,h],[W*.87,H*.2],[W,h]],'#335e69');else if(map==='Playa'){x.fillStyle='#f7d38a';x.fillRect(0,h,W,H*.14);poly([[0,h+H*.1],[W*.4,h+H*.04],[W*.7,h+H*.13],[W,h+H*.08]],'#238da6')}else for(let i=0;i<25;i++){let xx=((i*83-dist*1.5)%(W+100)+W+100)%(W+100)-50,bh=25+(i*37%90);x.fillStyle=map==='Noche'?'#111b34':'#64717d';x.fillRect(xx,h-bh,30+(i%4)*12,bh);if(map==='Noche'){x.fillStyle='#ffd56a';for(let j=0;j<4;j++)x.fillRect(xx+6+j*8,h-bh+10,3,4)}}x.fillStyle=ground;x.fillRect(0,h,W,H-h);poly([[cx-W*.065,h],[cx+W*.065,h],[cx+W*.75,H],[cx-W*.75,H]],road);x.strokeStyle='#e5edf3';x.lineWidth=2;x.beginPath();x.moveTo(cx-W*.065,h);x.lineTo(cx-W*.75,H);x.moveTo(cx+W*.065,h);x.lineTo(cx+W*.75,H);x.stroke();for(let i=0;i<12;i++){let z=((i/12+dist*.018)%1),y=h+z*z*(H-h),ww=1+z*W*.025;x.fillStyle='#e6f0f5';x.fillRect(cx-ww/2+steer*W*.02,y,ww,2+z*H*.035)}for(let i=0;i<10;i++){let z=((i/10+dist*.008)%1),y=h+z*z*(H-h),off=W*(.12+z*.48),hh=15+z*75;x.strokeStyle=map==='Noche'?'#a69bff':'#d6e1e8';x.lineWidth=2+z*2;x.beginPath();x.moveTo(cx-off,y);x.lineTo(cx-off,y-hh);x.moveTo(cx+off,y);x.lineTo(cx+off,y-hh);x.stroke();if(map==='Montaña'){poly([[cx-off-hh*.4,y-hh*.3],[cx-off,y-hh*1.2],[cx-off+hh*.4,y-hh*.3]],'#174f3d');poly([[cx+off-hh*.4,y-hh*.3],[cx+off,y-hh*1.2],[cx+off+hh*.4,y-hh*.3]],'#174f3d')}else{x.fillStyle=map==='Noche'?'#aaa0ff':'#fff0a1';x.beginPath();x.arc(cx-off,y-hh,3+z*3,0,7);x.arc(cx+off,y-hh,3+z*3,0,7);x.fill()}}let by=H*.82,hw=Math.min(W*.74,520);x.save();x.translate(steer*W*.12,0);poly([[W*.17,by+10],[W*.23,by-35],[W*.34,by-16],[W*.38,by+H*.1],[W*.25,H],[W*.13,H]],'#121b27');poly([[W*.83,by+10],[W*.77,by-35],[W*.66,by-16],[W*.62,by+H*.1],[W*.75,H],[W*.87,H]],'#121b27');x.lineCap='round';x.strokeStyle='#111820';x.lineWidth=Math.max(12,W*.025);x.beginPath();x.moveTo(W/2-hw*.48,by);x.lineTo(W/2+hw*.48,by);x.stroke();x.strokeStyle=s.color;x.lineWidth=Math.max(4,W*.008);x.beginPath();x.moveTo(W/2-hw*.48,by);x.lineTo(W/2+hw*.48,by);x.stroke();x.strokeStyle='#080d13';x.lineWidth=Math.max(20,W*.04);x.beginPath();x.moveTo(W/2-hw*.48,by);x.lineTo(W/2-hw*.32,by);x.moveTo(W/2+hw*.32,by);x.lineTo(W/2+hw*.48,by);x.stroke();rr(W/2-43,by-45,86,56,12,'#07121b','#49657a');x.fillStyle='#65ffd0';x.textAlign='center';x.font='bold 24px system-ui';x.fillText(Math.round(speed),W/2,by-16);x.font='10px system-ui';x.fillStyle='#b5d3e3';x.fillText(mode,W/2,by+2);x.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);function toast(msg){let el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1900)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(q=>q.classList.toggle('active',q===b));toast('Modo '+mode+' activado')});function hold(id,fn){let b=$(id),on=e=>{e.preventDefault();fn(true)},off=e=>{e.preventDefault();fn(false)};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))}hold('left',v=>steer=v?-1:0);hold('right',v=>steer=v?1:0);hold('accel',v=>go=v);hold('brake',v=>braking=v);function open(title,html){$('title').textContent=title;$('body').innerHTML=html;$('overlay').classList.add('show')}function close(){$('overlay').classList.remove('show')}$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('shopBtn').onclick=shop;$('mapsBtn').onclick=mapsMenu;function shop(){let h='<div class="cards">';bikes.forEach(s=>{let own=owned.includes(s.id);h+=`<div class="card ${selected===s.id?'selected':''}"><div class="scoot">🛴</div><h3>${s.name}</h3><div class="muted">Velocidad virtual: ECO ${s.max.ECO} · SPORT ${s.max.SPORT} · TURBO ${s.max.TURBO}</div><p class="price">${own?'DESBLOQUEADO':'🪙 '+s.price}</p><button class="buy" onclick="window.pickBike('${s.id}')">${own?(selected===s.id?'ELEGIDO':'ELEGIR'):'COMPRAR'}</button></div>`});h+='</div><p class="foot">Precios y velocidades ficticios del juego; no son especificaciones reales ni una oferta de venta.</p>';open('TIENDA DE PATINETES',h)}window.pickBike=id=>{let s=bikes.find(b=>b.id===id);if(owned.includes(id))selected=id;else if(coins>=s.price){coins-=s.price;owned.push(id);selected=id}else{toast('Te faltan monedas: explora para ganar más');return}$('model').textContent=s.name.toUpperCase()+' · PRIMERA PERSONA';toast(s.name+' seleccionado');shop()};function mapsMenu(){let h='<p class="muted">Elige el paisaje del recorrido.</p><div class="maps">';Object.keys(skies).forEach(m=>h+=`<button class="map ${m===map?'active':''}" onclick="window.pickMap('${m}')">${({Ciudad:'🌆',Montaña:'⛰️',Playa:'🏖️',Noche:'🌃'})[m]} ${m}<p class="muted">Recorrido infinito</p></button>`);h+='</div><p class="foot">Escenarios generados en tu navegador, sin conexión ni cuenta.</p>';open('ELIGE TU MAPA',h)}window.pickMap=m=>{map=m;toast('Mapa '+m+' seleccionado');mapsMenu()};addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1;if(e.key==='ArrowUp'||e.key==='w')go=true;if(e.key==='ArrowDown'||e.key==='s')braking=true;if(e.key==='Escape')close()});addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))steer=0;if(['ArrowUp','w'].includes(e.key))go=false;if(['ArrowDown','s'].includes(e.key))braking=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){go=false;braking=false;steer=0}})})();</script></body></html>
